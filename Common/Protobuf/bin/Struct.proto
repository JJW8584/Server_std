syntax = "proto3";
package Protocol;

import "Enum.proto";

// 방에 있는 플레이어 정보
message RoomPlayerInfo
{
    uint64 object_id = 1;
    PlayerType player_type = 2;
    Team team = 3;
    bool ready = 4;
}

message RoomInfo
{
    uint64 room_id = 1;
    string room_name = 2;

    RoomState state = 3;

    uint64 host_object_id = 4;
    uint32 max_player_count = 5;

    repeated RoomPlayerInfo players = 6;
}

// 플레이어 위치/이동 데이터
message MoveInfo
{ 
	float x = 1;
	float y = 2;
	float z = 3;
	float yaw = 4;
	MoveState state = 5;
}

message PlayerInfo
{
	uint64 object_id = 1;
    MoveInfo move_info = 2;
}

message MatchPlayerInfo
{
    PlayerInfo player_info = 1;
    PlayerType player_type = 2;
    Team team = 3;
}
    
// 매치 시작 시 한 번 전달되는 정보
message MatchInfo
{
    uint64 match_id = 1;
    uint32 duration_seconds = 2;

    uint32 red_score = 3;
    uint32 blue_score = 4;

    repeated MatchPlayerInfo match_players_info = 5;

    repeated MatchPlayerState match_players_state = 6;
}

// 플레이어별 인게임 상태
message MatchPlayerState
{
    int32 hp = 1;
    int32 max_hp = 2;
    bool is_alive = 3;
    uint32 kill_count = 4;
    uint32 death_count = 5;
}

// 경기 중 변하는 공용 상태
message MatchStateInfo
{
    uint64 match_id = 1;
    uint32 remaining_time_seconds = 2;

    uint32 red_score = 3;
    uint32 blue_score = 4;
}

// 경기 종료 시 결과
message MatchResult
{
    uint64 match_id = 1;
    Team winner_team = 2;

    uint32 red_score = 3;
    uint32 blue_score = 4;

    repeated MatchPlayerState player_results = 5;
}